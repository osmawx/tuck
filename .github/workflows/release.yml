name: Publish Tuck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuck-release
  queue: max

jobs:
  release:
    if: github.repository == 'osmawx/tuck' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TUCK_SPARKLE_DIR: ${{ runner.temp }}/tuck-sparkle
      TUCK_SIGNING_CERT_SHA1: ${{ vars.TUCK_SIGNING_CERT_SHA1 }}
      TUCK_SPARKLE_PUBLIC_KEY: ${{ vars.TUCK_SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release configuration
        env:
          TUCK_SIGNING_P12_BASE64: ${{ secrets.TUCK_SIGNING_P12_BASE64 }}
          TUCK_SIGNING_P12_PASSWORD: ${{ secrets.TUCK_SIGNING_P12_PASSWORD }}
          TUCK_SPARKLE_PRIVATE_KEY: ${{ secrets.TUCK_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for setting in TUCK_SIGNING_P12_BASE64 TUCK_SIGNING_P12_PASSWORD \
              TUCK_SIGNING_CERT_SHA1 \
              TUCK_SPARKLE_PRIVATE_KEY TUCK_SPARKLE_PUBLIC_KEY; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing release setting $setting"
              exit 1
            fi
          done
          public_key="$(printf '%s' "$TUCK_SPARKLE_PRIVATE_KEY" | swift scripts/sparkle-public-key.swift)"
          if [[ "$public_key" != "$TUCK_SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::The Sparkle private key does not match the configured public key."
            exit 1
          fi

      - name: Run regression checks
        run: |
          set -euo pipefail
          scripts/test-sparkle-key.sh
          sources=()
          while IFS= read -r -d '' source; do
            if [[ "${source##*/}" != main.swift ]]; then sources+=("$source"); fi
          done < <(find app/Sources -type f -name '*.swift' -print0)
          swiftc -O -swift-version 5 "${sources[@]}" app/Tests/main.swift -o "$RUNNER_TEMP/tuck-tests"
          "$RUNNER_TEMP/tuck-tests"

      - name: Fetch verified Sparkle SDK
        run: scripts/fetch-sparkle.sh "$TUCK_SPARKLE_DIR"

      - name: Build and sign
        env:
          TUCK_SIGNING_P12_BASE64: ${{ secrets.TUCK_SIGNING_P12_BASE64 }}
          TUCK_SIGNING_P12_PASSWORD: ${{ secrets.TUCK_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          export TUCK_BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 1))"
          export TUCK_VERSION="1.0.$GITHUB_RUN_NUMBER"
          scripts/build-release-app.sh

      - name: Sign update archive and feed
        env:
          TUCK_SPARKLE_PRIVATE_KEY: ${{ secrets.TUCK_SPARKLE_PRIVATE_KEY }}
        run: scripts/package-update.sh build/Tuck.app "$RUNNER_TEMP/tuck-release" "v1.0.$GITHUB_RUN_NUMBER"

      - name: Publish both files together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.$GITHUB_RUN_NUMBER"
          if release="$(gh release view "$tag" --json isDraft,targetCommitish)"; then
            if [[ "$(jq -r .targetCommitish <<< "$release")" != "$GITHUB_SHA" ]]; then
              echo "::error::The release tag is already associated with a different commit."
              exit 1
            fi
            if [[ "$(jq -r .isDraft <<< "$release")" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Tuck ${tag#v}" --generate-notes
          fi
          release_dir="$RUNNER_TEMP/tuck-release"
          gh release upload "$tag" "$release_dir/Tuck.zip" "$release_dir/appcast.xml" --clobber

          # A retried older run must never replace a newer appcast at the latest URL.
          latest=true
          published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          while IFS= read -r published_tag; do
            if [[ "$published_tag" =~ ^v1\.0\.([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              latest=false
              break
            fi
          done <<< "$published_tags"
          gh release edit "$tag" --draft=false --latest="$latest"
